
{% extends "base.html" %}

{% block title %}Checkout - ShopZone{% endblock %}

{% block content %}

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow p-4">
                <h3 class="text-center mb-4">Checkout</h3>

                <h5>Order Summary</h5>

                <div class="d-flex justify-content-between mb-3">
                    <span>Total Amount:</span>
                    <strong>₹{{ total }}</strong>
                </div>

                <hr>

                <form method="POST" action="{{ url_for('checkout') }}">

                    <div class="mb-3">
                        <label class="form-label">Delivery Address</label>
                        <textarea
                            name="address"
                            class="form-control"
                            rows="3"
                            placeholder="Enter your delivery address"
                            required
                        >{{ address if address else '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Payment Method</label>

                        <select
                            name="payment_method"
                            class="form-select"
                            required
                        >
                            <option value="cash">Cash on Delivery</option>
                            <option value="razorpay">Razorpay</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Continue to Payment
                    </button>

                </form>

            </div>

        </div>
    </div>
</div>

{% if razorpay_order_id %}

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
window.onload = function () {

    var options = {
        "key": {{ razorpay_key_id | tojson }},
        "amount": {{ amount | tojson }},
        "currency": "INR",
        "name": "ShopZone",
        "description": "Order Payment",
        "order_id": {{ razorpay_order_id | tojson }},

        "handler": function (response) {

            var form = document.createElement("form");

            form.method = "POST";
            form.action = {{ url_for('payment_verify') | tojson }};

            var fields = {
                "razorpay_payment_id": response.razorpay_payment_id,
                "razorpay_order_id": response.razorpay_order_id,
                "razorpay_signature": response.razorpay_signature,
                "order_id": {{ order_id | tojson }}
            };

            for (var key in fields) {
                var input = document.createElement("input");

                input.type = "hidden";
                input.name = key;
                input.value = fields[key];

                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit();
        },

        "prefill": {},

        "theme": {
            "color": "#3399cc"
        },

        "modal": {
            "ondismiss": function () {
                alert("Payment window closed. Your payment was not completed.");

                window.location.href =
                    {{ url_for('payment_failed', order_id=order_id) | tojson }};
            }
        }
    };

    var razorpay = new Razorpay(options);

    razorpay.on("payment.failed", function (response) {

        var error = response.error;

        console.log("Payment Failed");
        console.log("Code:", error.code);
        console.log("Description:", error.description);
        console.log("Reason:", error.reason);
        console.log("Source:", error.source);
        console.log("Step:", error.step);

        alert("Payment Failed: " + error.description);

        window.location.href =
            {{ url_for('payment_failed', order_id=order_id) | tojson }};
    });

    razorpay.open();
};
</script>

{% endif %}

{% endblock %}
